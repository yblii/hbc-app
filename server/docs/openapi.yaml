openapi: 3.1.0
info:
  title: Prisma API
  description: ""
  version: 1.0.0
paths: {}
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
        auth0Id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        isPaid:
          type: boolean
        groupId:
          type: integer
          format: int32
        group:
          $ref: "#/components/schemas/Group"
      required:
        - id
        - auth0Id
        - email
        - role
        - isPaid
    Group:
      type: object
      properties:
        id:
          type: integer
          format: int32
        players:
          type: array
          items:
            $ref: "#/components/schemas/User"
        queueJoinTime:
          type: string
          format: date-time
        courtId:
          type: integer
          format: int32
        court:
          $ref: "#/components/schemas/Court"
      required:
        - id
        - players
        - queueJoinTime
    Court:
      type: object
      properties:
        id:
          type: integer
          format: int32
        activeGroup:
          $ref: "#/components/schemas/Group"
        timerStartedAt:
          type: string
          format: date-time
        timerEndsAt:
          type: string
          format: date-time
      required:
        - id
    Role:
      type: string
      enum:
        - MEMBER
        - ADMIN
  responses: {}
  parameters: {}
  examples: {}
  requestBodies: {}
  headers: {}
  securitySchemes: {}
  links: {}
  callbacks: {}
tags: []
servers: []
